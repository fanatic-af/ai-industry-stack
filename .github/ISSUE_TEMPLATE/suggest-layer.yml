name: Suggest a layer
description: Propose a whole new layer for the stack.
title: "New layer: <name>"
labels: ["suggestion", "layer"]
body:
  - type: input
    id: name
    attributes:
      label: Name of the new layer
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What goes in it, and how it differs from what is already on the map
    validations:
      required: true
  - type: input
    id: by
    attributes:
      label: Credit me as
      description: Optional. Shown on the site as "suggested by".
