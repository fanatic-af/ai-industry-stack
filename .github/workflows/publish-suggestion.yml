name: Publish approved suggestion

# Runs when someone with write access adds the "approved" label to a suggestion issue.
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: publish-suggestion
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.apply.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: apply
        name: Add the suggestion to community-data.js
        run: node .github/scripts/apply-suggestion.mjs
      - name: Commit
        if: steps.apply.outputs.changed == 'true'
        env:
          ISSUE: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add community-data.js
          git commit -m "Add community suggestion #$ISSUE"
          git push origin HEAD:main
      - name: Reply on the issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          OK: ${{ steps.apply.outputs.ok }}
        run: |
          gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/suggestion-comment.md"
          if [ "$OK" = "true" ]; then
            gh issue close "$ISSUE" --reason completed
          else
            gh issue edit "$ISSUE" --remove-label approved
          fi

  deploy:
    needs: apply
    if: needs.apply.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
